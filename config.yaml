# ============================================================
# KDAA experiment configuration.
# Every script reads this file. Individual keys can be overridden via CLI --set.
# ============================================================

seed: 20260917

data:
  root: data                 # data root (metadata.csv, clips/ live here)
  metadata: data/metadata.csv
  sample_rate: 48000         # recommended: 48 kHz (preserves transient resolution)

# ---- segmentation (continuous session recording -> individual keystroke clips) ----
segment:
  # onset detection params
  band_hz: [400, 12000]      # keystroke energy bandpass
  frame_ms: 2.0              # energy frame length
  hop_ms: 1.0
  onset_percentile: 99.0     # adaptive onset threshold percentile
  min_gap_ms: 60             # min gap between onsets (avoid double detections)
  pre_ms: 5                  # window before onset
  post_ms: 95                # window after onset (covers press+release)
  # -> clip length = pre_ms + post_ms = 100 ms

# ---- features (mel-spectrogram) ----
feature:
  n_fft: 1024
  win_ms: 8.0                # <= Harrison et al. 14ms, focused on transient
  hop_ms: 2.0
  n_mels: 64
  fmin: 200
  fmax: 20000
  log_offset: 1.0e-6
  target_frames: 48          # fixed number of time frames (pad/crop)

# ---- augmentation ----
augment:
  enable: true
  time_shift_ms: 3           # random time shift (+/-)
  specaug_time: 8            # SpecAugment max time-mask width (frames)
  specaug_freq: 8            # frequency-mask max width (mel bins)
  noise_snr_db: [10, 30]     # random noise-mixing SNR range during training
  noise_prob: 0.5

# ---- model ----
model:
  arch: smallcnn             # smallcnn | coatnet_lite
  dropout: 0.2

# ---- training ----
train:
  split: session             # session | random | participant (default: session-wise)
  val_ratio: 0.2             # (random split only) validation fraction
  batch_size: 64
  epochs: 40
  lr: 0.001
  weight_decay: 1.0e-4
  label_smoothing: 0.05
  num_workers: 0
  device: auto               # auto | cpu | cuda
  out_dir: runs/exp1

# ---- evaluation / decoding ----
eval:
  topk: [1, 5]
  beam_width: 8              # automaton-constrained beam width
  figures_dir: runs/exp1/figures
